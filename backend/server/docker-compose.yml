services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cortanagpt
      POSTGRES_USER: cortanagpt
      POSTGRES_PASSWORD: cortanagpt_dev_only
    ports:
      - "5432:5432"
    volumes:
      - cortanagpt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortanagpt -d cortanagpt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cortanagpt-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cortanagpt-postgres:
  cortanagpt-redis:
