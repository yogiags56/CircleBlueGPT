buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.3.1'
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        jcenter()
        // React Native <= 0.70 publishes its Android Maven artifacts inside npm.
        maven { url "$rootDir/../../node_modules/react-native/android" }
    }
}
