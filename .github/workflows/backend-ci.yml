name: CortanaGPT backend CI

on:
  pull_request:
    paths:
      - "backend/server/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - "stage-004r/**"
    paths:
      - "backend/server/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: backend/server
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: backend/server
        run: npm run typecheck

      - name: Run tests
        working-directory: backend/server
        run: npm test

      - name: Build
        working-directory: backend/server
        run: npm run build
