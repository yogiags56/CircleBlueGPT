name: Android probe build

on:
  pull_request:
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  push:
    branches:
      - main
      - "stage-004r/**"
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Compile debug app and instrumentation APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Assemble probe and instrumentation APK
        working-directory: android/probe
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cortanagpt-probe-apks
          path: |
            android/probe/app/build/outputs/apk/debug/*.apk
            android/probe/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
