name: Android probe build

on:
  pull_request:
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  push:
    branches:
      - main
      - "stage-004r/**"
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Compile debug app and instrumentation APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run host-JVM compatibility policy tests
        working-directory: android/probe
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble probe and instrumentation APK
        working-directory: android/probe
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd android/probe && gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cortanagpt-probe-apks
          path: |
            android/probe/app/build/outputs/apk/debug/*.apk
            android/probe/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
